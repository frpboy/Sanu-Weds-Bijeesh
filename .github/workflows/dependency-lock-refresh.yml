name: Dependency vulnerability lockfile remediation
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
permissions:
  contents: write
jobs:
  remediate:
    if: github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'security/dependency-remediation-')
    runs-on: ubuntu-latest
    steps:
      - name: Check out remediation branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Apply compatible npm security fixes and refresh npm lockfile
        if: hashFiles('package-lock.json') != ''
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --lockfile-version=3 --ignore-scripts --no-audit --no-fund
          npm audit fix --package-lock-only --lockfile-version=3 --ignore-scripts --no-fund || true
          npm update --package-lock-only --lockfile-version=3 --ignore-scripts --no-fund
          npm install --package-lock-only --lockfile-version=3 --ignore-scripts --no-audit --no-fund
      - name: Apply compatible pnpm security fixes and refresh pnpm lockfile
        if: hashFiles('pnpm-lock.yaml') != ''
        run: |
          corepack enable
          pnpm audit --fix=update || true
          pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Commit refreshed lockfiles
        run: |
          [ -f package-lock.json ] && git add package-lock.json || true
          [ -f pnpm-lock.yaml ] && git add pnpm-lock.yaml || true
          if git diff --cached --quiet; then
            echo "No lockfile changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(deps): refresh lockfiles after audit fix"
          git push origin HEAD:${{ github.head_ref }}
